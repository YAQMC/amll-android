name: Publish Android package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish (for example 0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Test and publish GitHub Package
        run: >-
          gradle
          :amll:testDebugUnitTest
          :amll:assembleRelease
          :amll:publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMLL_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
