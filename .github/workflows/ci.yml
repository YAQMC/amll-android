name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build, test, and publish local artifact
        run: >-
          gradle
          :amll:testDebugUnitTest
          :amll:assembleRelease
          :amll:publishReleasePublicationToMavenLocal
          :demo:assembleDebug
      - name: Compile published artifact as YAQMC-style consumer
        run: gradle -p integration/consumer-smoke assembleDebug
